{% extends "base.html" %}
{% block body %}
<header class="hero"><div class="wrap"><h1>See what your next campaign will sell.</h1>
<p>Enter your campaign details and get an expected sales figure, based on 150,000 past campaigns.</p></div></header>
<main class="wrap"><form class="card" method="post" action="/submit">
<h2>Your campaign</h2>
{% if err %}<div class="err" role="alert">{{ err }}</div>{% endif %}
<div class="grid">
<div><label for="handle">Your handle</label><input id="handle" name="handle" placeholder="@yourname" maxlength="60" required></div>
<div><label for="platform">Platform</label><select id="platform" name="platform">{% for o in m.options.platform %}<option>{{ o }}</option>{% endfor %}</select></div>
<div><label for="category">Your category</label><select id="category" name="category">{% for o in m.options.influencer_category %}<option>{{ o }}</option>{% endfor %}</select></div>
<div><label for="ct">Campaign type</label><select id="ct" name="campaign_type">{% for o in m.options.campaign_type %}<option>{{ o }}</option>{% endfor %}</select></div>
<div><label for="eng">Engagements <small>({{ m.ranges.engagements[0]|n }} to {{ m.ranges.engagements[1]|n }})</small></label><input id="eng" name="engagements" type="number" min="{{ m.ranges.engagements[0] }}" max="{{ m.ranges.engagements[1] }}" required></div>
<div><label for="reach">Estimated reach <small>({{ m.ranges.estimated_reach[0]|n }} to {{ m.ranges.estimated_reach[1]|n }})</small></label><input id="reach" name="reach" type="number" min="{{ m.ranges.estimated_reach[0] }}" max="{{ m.ranges.estimated_reach[1] }}" required></div>
<div><label for="days">Duration in days <small>({{ m.ranges.duration[0] }} to {{ m.ranges.duration[1] }})</small></label><input id="days" name="days" type="number" min="{{ m.ranges.duration[0] }}" max="{{ m.ranges.duration[1] }}" required></div>
</div>
<button class="btn" type="submit">Get my estimate</button> <a class="btn alt" href="/guide">What do these terms mean?</a>
</form></main>
{% endblock %}
